limparDadosAnoAnterior:
  handler: src/handlers/manutencao/limparDadosAnoAnterior.execute
  timeout: 300
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:DeleteObject
      Resource:
        - ${self:custom.fotosObjectArn}
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - ${self:custom.ssmParameterArn}/encryption_key
        - ${self:custom.ssmParameterArn}/*/encryption_key
  events:
    - schedule:
        rate: cron(0 3 1 1 ? *)
