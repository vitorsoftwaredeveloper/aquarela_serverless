createTurma:
  handler: src/handlers/turmas/createTurma.execute
  events:
    - httpApi:
        method: POST
        path: /v1/turmas
        authorizer:
          name: cognitoAuthorizer

listTurmas:
  handler: src/handlers/turmas/listTurmas.execute
  events:
    - httpApi:
        method: GET
        path: /v1/turmas
        authorizer:
          name: cognitoAuthorizer

getTurmaById:
  handler: src/handlers/turmas/getTurmaById.execute
  events:
    - httpApi:
        method: GET
        path: /v1/turmas/{id}
        authorizer:
          name: cognitoAuthorizer

updateTurma:
  handler: src/handlers/turmas/updateTurma.execute
  events:
    - httpApi:
        method: PUT
        path: /v1/turmas/{id}
        authorizer:
          name: cognitoAuthorizer

removeTurma:
  handler: src/handlers/turmas/removeTurma.execute
  iamRoleStatementsInherit: true
  iamRoleStatements: ${self:custom.encryptionKeyIamStatements}
  events:
    - httpApi:
        method: DELETE
        path: /v1/turmas/{id}
        authorizer:
          name: cognitoAuthorizer

listCriancasDaTurma:
  handler: src/handlers/turmas/listCriancasDaTurma.execute
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
      Resource:
        - ${self:custom.fotosObjectArn}
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - ${self:custom.ssmParameterArn}/encryption_key
        - ${self:custom.ssmParameterArn}/*/encryption_key
  events:
    - httpApi:
        method: GET
        path: /v1/turmas/{id}/criancas
        authorizer:
          name: cognitoAuthorizer

vincularCrianca:
  handler: src/handlers/turmas/vincularCrianca.execute
  iamRoleStatementsInherit: true
  iamRoleStatements: ${self:custom.encryptionKeyIamStatements}
  events:
    - httpApi:
        method: POST
        path: /v1/turmas/{id}/criancas
        authorizer:
          name: cognitoAuthorizer

desvincularCrianca:
  handler: src/handlers/turmas/desvincularCrianca.execute
  iamRoleStatementsInherit: true
  iamRoleStatements: ${self:custom.encryptionKeyIamStatements}
  events:
    - httpApi:
        method: DELETE
        path: /v1/turmas/{id}/criancas/{criancaId}
        authorizer:
          name: cognitoAuthorizer
