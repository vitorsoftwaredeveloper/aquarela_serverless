createUsuario:
  handler: src/handlers/usuarios/createUsuario.execute
  environment:
    USER_POOL_ID: ${self:custom.environment.USER_POOL_ID}
  # AdminDeleteUser: rollback do Cognito se a gravação em `usuarios` falhar
  # depois do createCognitoUser (ver createUsuario.ts).
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminAddUserToGroup
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminDeleteUser
      Resource:
        - ${self:custom.environment.COGNITO_USER_POOL_ARN}
  events:
    - httpApi:
        method: POST
        path: /v1/usuarios
        authorizer:
          name: cognitoAuthorizer

listUsuarios:
  handler: src/handlers/usuarios/listUsuarios.execute
  events:
    - httpApi:
        method: GET
        path: /v1/usuarios
        authorizer:
          name: cognitoAuthorizer

getMe:
  handler: src/handlers/usuarios/getMe.execute
  events:
    - httpApi:
        method: GET
        path: /v1/me
        authorizer:
          name: cognitoAuthorizer

getUsuarioById:
  handler: src/handlers/usuarios/getUsuarioById.execute
  events:
    - httpApi:
        method: GET
        path: /v1/usuarios/{id}
        authorizer:
          name: cognitoAuthorizer

updateUsuario:
  handler: src/handlers/usuarios/updateUsuario.execute
  environment:
    USER_POOL_ID: ${self:custom.environment.USER_POOL_ID}
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminAddUserToGroup
        - cognito-idp:AdminRemoveUserFromGroup
      Resource:
        - ${self:custom.environment.COGNITO_USER_POOL_ARN}
  events:
    - httpApi:
        method: PUT
        path: /v1/usuarios/{id}
        authorizer:
          name: cognitoAuthorizer

redefinirSenhaUsuario:
  handler: src/handlers/usuarios/redefinirSenhaUsuario.execute
  environment:
    USER_POOL_ID: ${self:custom.environment.USER_POOL_ID}
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminSetUserPassword
      Resource:
        - ${self:custom.environment.COGNITO_USER_POOL_ARN}
  events:
    - httpApi:
        method: PUT
        path: /v1/usuarios/{id}/senha
        authorizer:
          name: cognitoAuthorizer

removeUsuario:
  handler: src/handlers/usuarios/removeUsuario.execute
  environment:
    USER_POOL_ID: ${self:custom.environment.USER_POOL_ID}
  # Hard delete (ver removeUsuario.ts): remove de vez do Cognito.
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminDeleteUser
      Resource:
        - ${self:custom.environment.COGNITO_USER_POOL_ARN}
  events:
    - httpApi:
        method: DELETE
        path: /v1/usuarios/{id}
        authorizer:
          name: cognitoAuthorizer
