createProfessor:
  handler: src/handlers/professores/createProfessor.execute
  environment:
    USER_POOL_ID: ${self:custom.environment.USER_POOL_ID}
  # Cria usuário dedicado (Cognito + `usuarios`) junto do professor — ver
  # createProfessor.ts. AdminDeleteUser: rollback se a transação Mongo falhar.
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminAddUserToGroup
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminDeleteUser
      Resource:
        - ${self:custom.environment.COGNITO_USER_POOL_ARN}
  events:
    - httpApi:
        method: POST
        path: /v1/professores
        authorizer:
          name: cognitoAuthorizer

listProfessores:
  handler: src/handlers/professores/listProfessores.execute
  events:
    - httpApi:
        method: GET
        path: /v1/professores
        authorizer:
          name: cognitoAuthorizer

getProfessorById:
  handler: src/handlers/professores/getProfessorById.execute
  events:
    - httpApi:
        method: GET
        path: /v1/professores/{id}
        authorizer:
          name: cognitoAuthorizer

updateProfessor:
  handler: src/handlers/professores/updateProfessor.execute
  environment:
    USER_POOL_ID: ${self:custom.environment.USER_POOL_ID}
  # Sincroniza email com o usuário/Cognito vinculado quando o email muda.
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminUpdateUserAttributes
      Resource:
        - ${self:custom.environment.COGNITO_USER_POOL_ARN}
  events:
    - httpApi:
        method: PUT
        path: /v1/professores/{id}
        authorizer:
          name: cognitoAuthorizer

removeProfessor:
  handler: src/handlers/professores/removeProfessor.execute
  environment:
    USER_POOL_ID: ${self:custom.environment.USER_POOL_ID}
  # Remove em definitivo o usuário/Cognito vinculado junto do soft delete do professor.
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminDeleteUser
      Resource:
        - ${self:custom.environment.COGNITO_USER_POOL_ARN}
  events:
    - httpApi:
        method: DELETE
        path: /v1/professores/{id}
        authorizer:
          name: cognitoAuthorizer
