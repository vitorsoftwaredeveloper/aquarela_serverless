createAviso:
  handler: src/handlers/avisos/createAviso.execute
  events:
    - httpApi:
        method: POST
        path: /v1/avisos
        authorizer:
          name: cognitoAuthorizer

listAvisos:
  handler: src/handlers/avisos/listAvisos.execute
  events:
    - httpApi:
        method: GET
        path: /v1/avisos
        authorizer:
          name: cognitoAuthorizer

updateAviso:
  handler: src/handlers/avisos/updateAviso.execute
  events:
    - httpApi:
        method: PUT
        path: /v1/avisos/{id}
        authorizer:
          name: cognitoAuthorizer

removeAviso:
  handler: src/handlers/avisos/removeAviso.execute
  events:
    - httpApi:
        method: DELETE
        path: /v1/avisos/{id}
        authorizer:
          name: cognitoAuthorizer
