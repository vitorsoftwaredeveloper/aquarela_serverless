getBalanco:
  handler: src/handlers/financeiro/getBalanco.execute
  events:
    - httpApi:
        method: GET
        path: /v1/financeiro/balanco
        authorizer:
          name: cognitoAuthorizer

getInadimplentes:
  handler: src/handlers/financeiro/getInadimplentes.execute
  iamRoleStatementsInherit: true
  iamRoleStatements: ${self:custom.encryptionKeyIamStatements}
  events:
    - httpApi:
        method: GET
        path: /v1/financeiro/inadimplentes
        authorizer:
          name: cognitoAuthorizer

marcarInadimplentes:
  handler: src/handlers/financeiro/marcarInadimplentes.execute
  events:
    - schedule:
        rate: cron(5 3 * * ? *)

dispararCobrancas:
  handler: src/handlers/financeiro/dispararCobrancas.execute
  environment:
    FIREBASE_SERVICE_ACCOUNT: ${self:custom.environment.FIREBASE_SERVICE_ACCOUNT}
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - ${self:custom.ssmParameterArn}/firebase_service_account
        - ${self:custom.ssmParameterArn}/*/firebase_service_account
        - ${self:custom.ssmParameterArn}/encryption_key
        - ${self:custom.ssmParameterArn}/*/encryption_key
  events:
    - schedule:
        rate: cron(0 12 5,20 * ? *)

dispararCobrancasManual:
  handler: src/handlers/financeiro/dispararCobrancasManual.execute
  environment:
    FIREBASE_SERVICE_ACCOUNT: ${self:custom.environment.FIREBASE_SERVICE_ACCOUNT}
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - ${self:custom.ssmParameterArn}/firebase_service_account
        - ${self:custom.ssmParameterArn}/*/firebase_service_account
        - ${self:custom.ssmParameterArn}/encryption_key
        - ${self:custom.ssmParameterArn}/*/encryption_key
  events:
    - httpApi:
        method: POST
        path: /v1/financeiro/cobrancas/disparar
        authorizer:
          name: cognitoAuthorizer
