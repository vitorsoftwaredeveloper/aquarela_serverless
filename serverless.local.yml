    events:
      - httpApi:
          method: GET
          path: /v1/me

  getUsuarioById:
    handler: src/handlers/usuarios/getUsuarioById.execute
    events:
      - httpApi:
          method: GET
          path: /v1/usuarios/{id}

  updateUsuario:
    handler: src/handlers/usuarios/updateUsuario.execute
    events:
      - httpApi:
          method: PUT
          path: /v1/usuarios/{id}

  removeUsuario:
    handler: src/handlers/usuarios/removeUsuario.execute
    events:
      - httpApi:
          method: DELETE
          path: /v1/usuarios/{id}

  createProfessor:
