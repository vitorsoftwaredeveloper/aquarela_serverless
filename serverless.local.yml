service: aquarela-serverless

frameworkVersion: "3"

# Ambiente 100% inline (sem `${file(./config/dev.json)}`): dev.json usa
# `${ssm:...}` para as chaves do Cognito, e o Serverless resolve TODAS as
# variáveis do objeto referenciado ao carregar o config — mesmo as que
# nenhuma function local usa. Isso quebraria `serverless offline` sem
# credenciais AWS/parâmetros já provisionados. Local.yml fica deliberadamente
# sem Cognito; ver checklist de setup manual no CLAUDE.md.
custom:
  environment:
    DB: mongodb://localhost:27017/aquarela_serverless?replicaSet=rs0
    SERVICE: aquarela_serverless
    # Chave só de desenvolvimento local (dado descartável no Mongo local) —
    # nunca reaproveitar em staging/prod, que buscam a própria via SSM.
    ENCRYPTION_KEY: f1b17b2618c9d09d7e3bcb5a7c4ec0b8d9431f127b56375328a0bbe5685ac7b3
  esbuild: ${file(esbuild.config.js)}

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    DB: ${self:custom.environment.DB}
    STAGE: local
    SERVICE_NAME: ${self:custom.environment.SERVICE}
    ENCRYPTION_KEY: ${self:custom.environment.ENCRYPTION_KEY}

plugins:
  - serverless-esbuild
  - serverless-offline

# Sem `authorizer` e sem variáveis vindas do SSM (COGNITO_URL/CLIENT_ID/
# USER_POOL_ID) — assim `serverless offline` sobe sem precisar de acesso à
# AWS. Papel/ownership localmente são simulados via headers x-dev-sub /
# x-dev-role / x-dev-email (ver src/middlewares/auth.ts). Rotas que chamam
# o Cognito (provisionar/desabilitar usuário) só funcionam de fato depois
# do User Pool real ser criado (ver checklist no CLAUDE.md).
functions:
  createUsuario:
    handler: src/handlers/usuarios/createUsuario.execute
    events:
      - httpApi:
          method: POST
          path: /v1/usuarios

  listUsuarios:
    handler: src/handlers/usuarios/listUsuarios.execute
    events:
      - httpApi:
          method: GET
          path: /v1/usuarios

  getMe:
