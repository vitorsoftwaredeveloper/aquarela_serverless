service: aquarela-serverless

frameworkVersion: "3"

custom:
  environment: ${file(./config/${self:provider.stage}.json):environment}
  esbuild: ${file(esbuild.config.js)}
  prune:
    automatic: true
    number: 3
  ssmParameterArn: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/aquarela_serverless

  fotosBucket: ${self:service}-${self:provider.stage}-fotos-${aws:accountId}
  fotosObjectArn: arn:aws:s3:::${self:custom.fotosBucket}/*
  fotosLeituraIamStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
      Resource:
        - ${self:custom.fotosObjectArn}
  fotosEscritaIamStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource:
        - ${self:custom.fotosObjectArn}

package:
  individually: true

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 27
  environment:
    STAGE: ${self:provider.stage}
    DB: ${self:custom.environment.DB}
    ENCRYPTION_KEY: ${self:custom.environment.ENCRYPTION_KEY}
    FOTOS_BUCKET: ${self:custom.fotosBucket}
    REGION: ${self:custom.environment.REGION}

  httpApi:
    cors:
      allowedOrigins:
        - ${self:custom.environment.FRONTEND_URL}
        - http://localhost:3000
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      allowCredentials: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${self:custom.environment.COGNITO_URL}
        audience:
          - ${self:custom.environment.CLIENT_ID}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - ${self:custom.ssmParameterArn}/db
        - ${self:custom.ssmParameterArn}/*/db
        - ${self:custom.ssmParameterArn}/encryption_key
        - ${self:custom.ssmParameterArn}/*/encryption_key

    - Effect: Allow
      Action:
        - kms:Decrypt
      Resource: "*"
      Condition:
        StringEquals:
          kms:ViaService: ssm.${aws:region}.amazonaws.com

plugins:
  - serverless-esbuild
  - serverless-iam-roles-per-function
  - serverless-prune-plugin

functions:
  - ${file(src/handlers/usuarios/functions.yml)}
  - ${file(src/handlers/professores/functions.yml)}
  - ${file(src/handlers/turmas/functions.yml)}
  - ${file(src/handlers/criancas/functions.yml)}
  - ${file(src/handlers/agendas/functions.yml)}
  - ${file(src/handlers/mensalidades/functions.yml)}
  - ${file(src/handlers/pagamentos/functions.yml)}
  - ${file(src/handlers/webhooks/functions.yml)}
  - ${file(src/handlers/despesas/functions.yml)}
  - ${file(src/handlers/financeiro/functions.yml)}
  - ${file(src/handlers/configPrecos/functions.yml)}
  - ${file(src/handlers/simulador/functions.yml)}
  - ${file(src/handlers/avisos/functions.yml)}
  - ${file(src/handlers/planosAula/functions.yml)}

resources:
  Resources:
    FotosBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.fotosBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        CorsConfiguration:
          CorsRules:
            - AllowedMethods:
                - GET
              AllowedOrigins:
                - ${self:custom.environment.FRONTEND_URL}
                - http://localhost:3000
              AllowedHeaders:
                - "*"
              ExposedHeaders:
                - ETag
              MaxAge: 3000
        LifecycleConfiguration:
          Rules:
            - Id: AbortarUploadsIncompletos
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1

    FotosBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FotosBucket
        PolicyDocument:
          Statement:
            - Sid: NegarTrafegoSemTls
              Effect: Deny
              Principal: "*"
              Action: s3:*
              Resource:
                - arn:aws:s3:::${self:custom.fotosBucket}
                - arn:aws:s3:::${self:custom.fotosBucket}/*
              Condition:
                Bool:
                  aws:SecureTransport: false

  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 25
