service: aquarela-serverless

frameworkVersion: "3"

custom:
  environment: ${file(./config/${self:provider.stage}.json):environment}
  esbuild: ${file(esbuild.config.js)}
  prune:
    automatic: true
    number: 3
  ssmParameterArn: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/aquarela_serverless

package:
  individually: true

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 27
  environment:
    STAGE: ${self:provider.stage}
    DB: ${self:custom.environment.DB}
    ENCRYPTION_KEY: ${self:custom.environment.ENCRYPTION_KEY}

  httpApi:
    cors:
      allowedOrigins:
        - ${self:custom.environment.FRONTEND_URL}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      allowCredentials: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${self:custom.environment.COGNITO_URL}
        audience:
          - ${self:custom.environment.CLIENT_ID}
  # Baseline compartilhado por toda função (via serverless-iam-roles-per-function
  # + iamRoleStatementsInherit: true) — só o que é lido em praticamente toda
  # invocação (conexão Mongo, chave de criptografia). Permissões mais
  # específicas (Cognito, MercadoPago) ficam só nas functions.yml que
  # realmente as usam — ver src/handlers/usuarios, /pagamentos, /webhooks.
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - ${self:custom.ssmParameterArn}/db
        - ${self:custom.ssmParameterArn}/*/db
        - ${self:custom.ssmParameterArn}/encryption_key
        - ${self:custom.ssmParameterArn}/*/encryption_key
    # Necessário apenas quando o parâmetro for SecureString (KMS alias/aws/ssm).
    # Escopado por condição: só permite Decrypt via serviço SSM.
    - Effect: Allow
      Action:
        - kms:Decrypt
      Resource: "*"
      Condition:
        StringEquals:
          kms:ViaService: ssm.${aws:region}.amazonaws.com

plugins:
  - serverless-esbuild
  - serverless-iam-roles-per-function
  - serverless-prune-plugin

functions:
  - ${file(src/handlers/usuarios/functions.yml)}
  - ${file(src/handlers/professores/functions.yml)}
  - ${file(src/handlers/turmas/functions.yml)}
  - ${file(src/handlers/criancas/functions.yml)}
  - ${file(src/handlers/agendas/functions.yml)}
  - ${file(src/handlers/mensalidades/functions.yml)}
  - ${file(src/handlers/pagamentos/functions.yml)}
  - ${file(src/handlers/webhooks/functions.yml)}
  - ${file(src/handlers/despesas/functions.yml)}
  - ${file(src/handlers/financeiro/functions.yml)}
  - ${file(src/handlers/configPrecos/functions.yml)}
  - ${file(src/handlers/simulador/functions.yml)}

resources:
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 25
